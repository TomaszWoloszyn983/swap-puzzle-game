<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tile Swap Puzzle">
    <meta name="keywords" content="Puzzle, game, tile, swap, jigsaw">
    <meta name="author" content="Tomasz Woloszyn">
    <link rel="stylesheet" href="style.css">

    <title>Tile Swap Puzzle</title>

    <style>
        #piecesContainer {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            margin-top: 20px;
        }
        #piecesContainer img {
            width: 100%;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>
            <!-- Header Section -->
    <div id="header">
        <nav id="nav_bar">
            <button class="nav_button" id="help_btn" >Help</button>
            <button class="nav_button" id="about_btn" >About</button>
        </nav>
        <h1>
            <label id="game_title">Tile Swap Puzzle</label> 
        </h1>
        <div id="status"></div>
    </div>

    <!-- Main section containing: Game board, info panel and Best Results list -->
    <main id="game_container">
        <section id="rules">
            <!-- Insert welcome content from textContent/leftPanel.html -->
            <div id="welcomeContent"></div>
            <p id="message_box"></p>
        </section>
        
                <!-- Game board -->
        <section id="game_window">
            <div id="board"></div>

            <h2>Turns: <span id="turns">0</span></h2>
            <button type="button" id="btn_new_game">Start New Game</button>

            <!-- Upload Image Button -->
            <button type="button" id="btn_upload_image">Upload Image</button>

        <!-- Upload Image Popup -->
            <div class="popup" id="popup-upload">
                <div class="overlay"></div>
                <div class="content">
                    <h3>Upload New Image</h3>

                    <form id="uploadForm" enctype="multipart/form-data">
                        <input type="file" name="image" id="imageInput" accept="image/*" required>
                        <br><br>
                        <!-- <button type="submit">Upload & Split</button> -->
                        <button type="submit" id="uploadSubmit">Upload & Split</button>
                        <span id="uploadLoading" style="display:none;">Processing image...</span>
                    </form>

                    <br>
                    <button type="button" id="closeUpload">Cancel</button>
                </div>
            </div>

            <div id="piecesContainer"></div>

            <script>
                document.getElementById("uploadForm").addEventListener("submit", async function(e) {
                    e.preventDefault();

                    const formData = new FormData();
                    console.log("Submit image upload.")
                    formData.append("image", document.getElementById("imageInput").files[0]);

                    const res = await fetch("/upload", {
                        method: "POST",
                        body: formData
                    });

                    const data = await res.json();
                    if (data.pieces) {
                        const container = document.getElementById("piecesContainer");
                        container.innerHTML = ""; // Clear old images

                        data.pieces.forEach(url => {
                            const img = document.createElement("img");
                            img.src = url + "?t=" + Date.now(); // Prevent caching
                            container.appendChild(img);
                        });
                    }
                });
            </script>


            <!-- Popup boxes section -->
            <div class = "popup" id="popup-1"> 
                <div class="overlay"></div>
                <div class="content">
                    <!-- <div class="close-btn" onclick="togglePopup()">&times;</div> -->
                    <h3>Well Done!</h3>
                    <p id="popupContentOne"></p>
                    <button type="button" id="submit_no_record">OK</button>
                </div>
            </div>

            <div class = "popup" id="popup-2"> 
                <div class="overlay"></div>
                <div class="content">
                    <!-- <div class="close-btn" >&times;</div> temporarly removed function onclick="togglePopup2()" -->
                    <h3>Well Done!</h3>
                    <p id="popupContentTwo"></p>
                    <input type="text" id="name_box" placeholder="Your name">
                    <button type="submit" id="submit_name" >OK</button>
                </div>
            </div>
                <!-- Help Popup box -->
            <div class = "popup" id="popup-help"> 
                <div class="overlay"></div>
                <div class="content">
                    <!-- Insert help content from textContent/help.html -->
                    <div id="helpContent"></div>
                    <button type="button" id="closeHelp">Close</button>
                </div>
            </div>
                <!-- About Popup box -->
            <div class = "popup" id="popup-about"> 
                <div class="overlay"></div>
                <div class="content">
                    <!-- Insert help content from textContent/about.html -->
                    <div id="aboutContent"></div>
                    <button type="button" id="closeAbout">Close</button>
                </div>
            </div>

        </section>
        
            <!-- Best Results list -->
        <section id="results">
            <div id="leaderboard">
                <h2>Best results</h2>
                <ol id="ranking">
                    <li></li>
                    <li></li>
                    <li></li>
                </ol>
            </div>
            <br>
            <div id="wallet">
                💰 Currently owned tokens: <span id="tokenBalance">0</span>
                <br>
                <p>Collect at least 100 tokens to receive a reward.</p>
            </div>
            <div id="claimReward-container">
                <!-- <button onclick="claimReward()">Claim NFT Reward</button> -->
                <!-- Claim Reward Popup -->
                <button type="button" id="btn_claim_reward">Claim NFT Reward</button>
                    <!-- Popup -->
                <div class="popup" id="popup-claimReward">
                    <div class="overlay" id="overlay-claim"></div>
                    <div class="content">
                        <h3>Claim NFT Reward</h3>
                        <div>
                            <br>
                            <h4>Connect your wallet</h4>
                            <button id="connectWalletBtn">Connect Wallet</button>
                            <br><br>
                            <div>
                                Connected Wallet: <span id="walletDisplay">Not connected</span>
                            </div>
                        </div>

                        <form id="claimForm">
                            <input 
                                type="text" 
                                id="walletAddress" 
                                placeholder="Enter wallet address (0x...)" 
                                required
                            >
                            <br><br>
                            <button type="submit" id="claimSubmitBtn" disabled>
                                Claim
                            </button>
                        </form>
                        <br>
                        <button type="button" id="closeClaimPopup">Cancel</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <br>
    <hr>
        <!-- Footer -->
    <footer id="footer">
        <label>All Copyrights Reserved</label>
    </footer>

    <script rel="script" src="script.js" ></script>
    <script src="uploadImage.js" ></script>
</body>
</html>
