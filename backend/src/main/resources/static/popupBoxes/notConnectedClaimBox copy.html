<div id="walletNotConnected">

    <h4>Connect your wallet</h4>

    <button id="connectWalletBtn">
        Connect Wallet
    </button>

    <br><br>

    <div>
        Connected Wallet:
        <span id="walletDisplay">
            Not connected
        </span>
    </div>

    <br>

    <form id="claimForm">
        <input
            type="text"
            id="walletAddress"
            placeholder="Enter wallet address (0x...)"
            required
        >

        <br><br>

        <button
            type="submit"
            id="claimSubmitBtn"
            disabled>
            Claim
        </button>
    </form>

</div>
